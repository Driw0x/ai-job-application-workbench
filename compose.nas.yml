services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      KNOWLEDGE_BASE_PATH: /knowledge-base
      DATABASE_PATH: /app/data/job_tracker.db
      CHATGPT_OAUTH_REDIRECT_URI: ${CHATGPT_OAUTH_REDIRECT_URI:-http://127.0.0.1:8080/auth/callback}
    volumes:
      - ${KNOWLEDGE_BASE_PATH:?Set KNOWLEDGE_BASE_PATH to the host KB directory}:/knowledge-base
      - ./data:/app/data
      - ./data/chatgpt:/home/node/.config/AIJobApplicationWorkbench/chatgpt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${JOB_TRACKER_PORT:-8080}:80"
